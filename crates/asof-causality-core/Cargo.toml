[package]
name = "asof-causality-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Deterministic causality kernel for auditing temporal leakage in historical predictions"
documentation = "https://docs.rs/asof-causality-core"
keywords.workspace = true
categories.workspace = true

[lib]
name = "asof_causality_core"
path = "src/lib.rs"

[dependencies]
blake3 = { version = "1.8.5", default-features = false }

[dev-dependencies]
proptest = "1.6"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
