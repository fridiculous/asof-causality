[package]
name = "asof-causality-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line harness for detecting temporal leakage with as-of replay"
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "asof-causality"
path = "src/main.rs"

[dependencies]
asof-causality-core = { path = "../asof-causality-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.41"
jsonschema = "0.33"
predicates = "3.1"
tempfile = "3.13"
