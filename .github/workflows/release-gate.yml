name: Release Gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected asof-causality-cli version, without leading v. Leave blank to use Cargo.toml."
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Pre-tag release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate release input
        id: release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$(python3 - <<'PY'
          import pathlib
          import re

          def package_version(path: str) -> str:
              text = pathlib.Path(path).read_text()
              match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"{path} does not contain a package version")
              return match.group(1)

          cli = package_version("crates/asof-causality-cli/Cargo.toml")
          core = package_version("crates/asof-causality-core/Cargo.toml")
          if cli != core:
              raise SystemExit(f"crate versions differ: cli={cli}, core={core}")
          print(cli)
          PY
          )"
          tag="v$version"

          if [ -n "${EXPECTED_VERSION:-}" ] && [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "workflow input version '$EXPECTED_VERSION' does not match asof-causality-cli version '$version'" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Release Gate should be run from main, not '${GITHUB_REF_NAME}'." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build API docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked
      - name: Causality checks on release binary
        run: target/release/asof-causality check examples/late-arrival.pipe
      - name: Negative-control leakage check on release binary
        run: target/release/asof-causality negative-control examples/lookahead-negative-control.pipe
      - name: Core package dry run
        run: cargo package --locked --allow-dirty --list -p asof-causality-core
      - name: Write release summary
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          {
            echo "## Release gate passed"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Tag to create: \`$TAG\`"
            echo "- Tested commit: \`$sha\`"
            echo
            echo "Next step:"
            echo
            echo "Run the **Release Binaries** workflow from \`main\` with:"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Publish: \`true\`"
            echo
            echo "Fallback local tag commands:"
            echo
            echo '```bash'
            echo "git fetch origin main --tags"
            echo "git tag $TAG $sha"
            echo "git push origin $TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
