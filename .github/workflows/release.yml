name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            smoke: true
          - os: macos-latest
            target: x86_64-apple-darwin
            smoke: false
          - os: macos-latest
            target: aarch64-apple-darwin
            smoke: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p asof-cli
      - name: Smoke test native binary
        if: matrix.smoke
        run: |
          target/${{ matrix.target }}/release/asof replay examples/late-arrival.pipe
          target/${{ matrix.target }}/release/asof check examples/late-arrival.pipe
          target/${{ matrix.target }}/release/asof negative-control examples/lookahead-negative-control.pipe
      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          cp target/${{ matrix.target }}/release/asof dist/pkg/asof-${{ matrix.target }}
          cp README.md LICENSE dist/pkg/
          tar -C dist/pkg -czf dist/asof-causality-${{ matrix.target }}.tar.gz asof-${{ matrix.target }} README.md LICENSE
          (cd dist && shasum -a 256 asof-causality-${{ matrix.target }}.tar.gz > asof-causality-${{ matrix.target }}.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: asof-causality-${{ matrix.target }}
          path: |
            dist/asof-causality-${{ matrix.target }}.tar.gz
            dist/asof-causality-${{ matrix.target }}.tar.gz.sha256
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 ./*.tar.gz | sed 's#  \./#  #' | sort) > dist/SHA256SUMS.txt
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            dist/asof-causality-*.tar.gz \
            dist/asof-causality-*.tar.gz.sha256 \
            dist/SHA256SUMS.txt
