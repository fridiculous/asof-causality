name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected asof-causality-cli version, without leading v. Leave blank to use Cargo.toml."
        required: false
        type: string
      publish:
        description: "Publish the final GitHub Release from the selected main commit."
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and tag
        id: version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH_FINAL: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          publish="${PUBLISH_FINAL:-false}"
          version="$(python3 - <<'PY'
          import pathlib
          import re

          def package_version(path: str) -> str:
              text = pathlib.Path(path).read_text()
              match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"{path} does not contain a package version")
              return match.group(1)

          cli = package_version("crates/asof-causality-cli/Cargo.toml")
          core = package_version("crates/asof-causality-core/Cargo.toml")
          if cli != core:
              raise SystemExit(f"crate versions differ: cli={cli}, core={core}")
          print(cli)
          PY
          )"
          tag="v$version"

          case "$publish" in
            true|false) ;;
            *) echo "publish must be true or false, got '$publish'" >&2; exit 1 ;;
          esac

          if [ -n "${EXPECTED_VERSION:-}" ] && [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "workflow input version '$EXPECTED_VERSION' does not match asof-causality-cli version '$version'" >&2
            exit 1
          fi

          if [ "$publish" = "true" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "manual final publish must run from main, not '$GITHUB_REF_NAME'" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ref_tag="${GITHUB_REF#refs/tags/}"
            if [ "$ref_tag" != "$tag" ]; then
              echo "tag '$ref_tag' does not match asof-causality-cli version '$version'; expected '$tag'" >&2
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p asof-causality-cli
      - name: Smoke test native release binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          target/${{ matrix.target }}/release/asof-causality replay examples/late-arrival.pipe
          target/${{ matrix.target }}/release/asof-causality check examples/late-arrival.pipe
          target/${{ matrix.target }}/release/asof-causality negative-control examples/lookahead-negative-control.pipe
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          cp target/${{ matrix.target }}/release/asof-causality dist/pkg/asof-causality-${{ matrix.target }}
          cp README.md LICENSE dist/pkg/
          tar -C dist/pkg -czf dist/asof-causality-${{ matrix.target }}.tar.gz asof-causality-${{ matrix.target }} README.md LICENSE
          shasum -a 256 dist/asof-causality-${{ matrix.target }}.tar.gz > dist/asof-causality-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: asof-causality-${{ matrix.target }}
          path: |
            dist/asof-causality-${{ matrix.target }}.tar.gz
            dist/asof-causality-${{ matrix.target }}.tar.gz.sha256
          retention-days: 14

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 ./*.tar.gz | sed 's#  \./#  #' | sort) > dist/SHA256SUMS.txt
      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          assets=(dist/asof-causality-*.tar.gz dist/asof-causality-*.tar.gz.sha256 dist/SHA256SUMS.txt)
          args=(
            release create "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$TAG"
            --generate-notes
          )

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--verify-tag)
          fi

          gh "${args[@]}" "${assets[@]}"
