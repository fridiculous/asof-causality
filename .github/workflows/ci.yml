name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      INSTA_UPDATE: no
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build API docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked
      - name: Replay smoke test
        run: target/release/asof-causality replay examples/late-arrival.pipe
      - name: Causality checks on release binary
        run: target/release/asof-causality check examples/late-arrival.pipe
      - name: Negative-control leakage check on release binary
        run: target/release/asof-causality negative-control examples/lookahead-negative-control.pipe
      - name: Core package dry run
        run: cargo package --locked --allow-dirty --list -p asof-causality-core
