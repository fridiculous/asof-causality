name: Verify Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Verify GitHub release and assets
        shell: bash
        run: |
          set -euo pipefail

          required_assets=(
            "asof-causality-aarch64-apple-darwin.tar.gz"
            "asof-causality-x86_64-apple-darwin.tar.gz"
            "asof-causality-x86_64-unknown-linux-gnu.tar.gz"
            "SHA256SUMS.txt"
          )

          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets > release.json

          python3 - <<'PY'
          import json

          required = {
              "asof-causality-aarch64-apple-darwin.tar.gz",
              "asof-causality-x86_64-apple-darwin.tar.gz",
              "asof-causality-x86_64-unknown-linux-gnu.tar.gz",
              "SHA256SUMS.txt",
          }
          data = json.load(open("release.json"))
          names = {asset["name"] for asset in data["assets"]}
          missing = sorted(required - names)
          if data["isDraft"]:
              raise SystemExit("release is still a draft")
          if data["isPrerelease"]:
              raise SystemExit("release is marked as a prerelease; final release expected")
          if missing:
              raise SystemExit("missing required assets: " + ", ".join(missing))
          PY

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          gh release download "$TAG" --repo "$REPO" --pattern "SHA256SUMS.txt" --dir "$tmp_dir"

          for asset in "${required_assets[@]}"; do
            if [ "$asset" = "SHA256SUMS.txt" ]; then
              continue
            fi

            gh release download "$TAG" --repo "$REPO" --pattern "$asset" --dir "$tmp_dir"

            target="${asset#asof-causality-}"
            target="${target%.tar.gz}"
            tar -tzf "$tmp_dir/$asset" > "$tmp_dir/$asset.contents"
            grep -qx "asof-causality-$target" "$tmp_dir/$asset.contents"
            grep -qx "README.md" "$tmp_dir/$asset.contents"
            grep -qx "LICENSE" "$tmp_dir/$asset.contents"
          done

          (cd "$tmp_dir" && sha256sum --check SHA256SUMS.txt)

          {
            echo "## Release verification passed"
            echo
            echo "- Repository: \`$REPO\`"
            echo "- Tag: \`$TAG\`"
            echo "- Required assets: present"
            echo "- Tarball contents: each archive contains \`asof-causality-<target>\`, \`README.md\`, and \`LICENSE\`"
            echo "- SHA256 manifest: present and verified"
          } >> "$GITHUB_STEP_SUMMARY"
